name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than floating: a toolchain that moves under you turns an
  # unrelated pull request red, and this is the version the README asks for.
  WASM_PACK_VERSION: v0.15.0
  # Same reasoning, and the case that proved it. This tracked `stable` until
  # 1.98 shipped `clippy::manual_slice_fill`, and a loop nobody had touched
  # since it was written became an error under `-D warnings`. Two days of red
  # on `main` with no commit responsible for it. Raise this deliberately, and
  # take whatever the new release has to say in its own pull request.
  RUST_VERSION: 1.98.0
  # Same again. The deploy is the last thing that should surprise anybody.
  VERCEL_CLI_VERSION: 58.4.4

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The released binary rather than a third-party action: the maintained
      # ones are still on a runtime GitHub has deprecated, and a pinned tarball
      # is faster than building from source and one fewer thing to trust.
      - name: Install wasm-pack
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version

      # The web app cannot type-check without the generated bindings.
      - name: Build the engine for the browser
        run: |
          wasm-pack build crates/repath-wasm --release --target web \
            --out-dir ../../web/src/lib/wasm --out-name repath

      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/build

  # Production is a prebuilt upload rather than a build Vercel runs itself, and
  # that is not a shortcut: `web/src/lib/wasm` is generated by wasm-pack and is
  # not in the repository, so a build from a checkout would find no engine and
  # fail. The site that goes up is the one the tests above ran against, taken
  # from the artifact rather than built a second time — building it again would
  # publish something nothing has checked.
  deploy:
    name: Deploy
    needs: [engine, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://repath-lake.vercel.app
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: site

      - name: Lay out the prebuilt deployment
        run: |
          mkdir -p .vercel/output/static
          cp -r site/. .vercel/output/static/
          # Everything that is not a file on disk is the app's own route, which
          # is what adapter-static's fallback page is for.
          cat > .vercel/output/config.json <<'JSON'
          {"version":3,"routes":[{"handle":"filesystem"},{"src":"/.*","dest":"/index.html"}]}
          JSON

      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy             --prebuilt --prod --yes --token "$VERCEL_TOKEN" > deployment.txt
          echo "Deployed $(cat deployment.txt)" >> "$GITHUB_STEP_SUMMARY"

      # A deploy that reports success while the alias still serves the previous
      # bundle is the failure worth catching, and a 200 does not catch it: the
      # old site answers 200 perfectly well. The entry script's name carries a
      # hash of its contents, so asking the live page which one it loads says
      # whether this build is the one being served.
      - name: Check the alias is serving this build
        run: |
          entry=$(grep -oE '_app/immutable/entry/start\.[A-Za-z0-9_-]+\.js' site/index.html | head -1)
          if [ -z "$entry" ]; then
            echo "no entry script in the built index.html, so there is nothing to compare" >&2
            exit 1
          fi
          echo "looking for $entry"
          for attempt in $(seq 1 10); do
            if curl -sf https://repath-lake.vercel.app/ | grep -qF "$entry"; then
              echo "the alias is serving this build" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: not yet"
            sleep 6
          done
          echo "the alias never came to serve $entry" >&2
          exit 1
