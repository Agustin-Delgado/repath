name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than floating: a toolchain that moves under you turns an
  # unrelated pull request red, and this is the version the README asks for.
  WASM_PACK_VERSION: v0.15.0
  # Same reasoning, and the case that proved it. This tracked `stable` until
  # 1.98 shipped `clippy::manual_slice_fill`, and a loop nobody had touched
  # since it was written became an error under `-D warnings`. Two days of red
  # on `main` with no commit responsible for it. Raise this deliberately, and
  # take whatever the new release has to say in its own pull request.
  RUST_VERSION: 1.98.0

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The released binary rather than a third-party action: the maintained
      # ones are still on a runtime GitHub has deprecated, and a pinned tarball
      # is faster than building from source and one fewer thing to trust.
      - name: Install wasm-pack
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version

      # The web app cannot type-check without the generated bindings.
      - name: Build the engine for the browser
        run: |
          wasm-pack build crates/repath-wasm --release --target web \
            --out-dir ../../web/src/lib/wasm --out-name repath

      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/build
