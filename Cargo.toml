[workspace]
resolver = "3"
members = ["crates/repath-core", "crates/repath-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/repath/repath"
authors = ["repath contributors"]

[workspace.dependencies]
repath-core = { path = "crates/repath-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
