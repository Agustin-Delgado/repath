<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Link previews read this file as it is, without running any script, and
			with `ssr = false` nothing from <svelte:head> is in it: whatever a
			preview shows has to be written here.
		-->
		<meta
			name="description"
			content="A free and open source mixed-signal circuit simulator that runs entirely in your browser."
		/>
		<meta name="theme-color" content="#0e1116" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="repath" />
		<meta property="og:title" content="repath — free circuit simulator" />
		<meta
			property="og:description"
			content="A free and open source mixed-signal circuit simulator that runs entirely in your browser."
		/>
		<meta property="og:url" content="https://repath-lake.vercel.app/" />
		<!-- Absolute: a preview fetches it from wherever the link was pasted. -->
		<meta property="og:image" content="https://repath-lake.vercel.app/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The repath logo: a lowercase r whose arm is a step response." />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- The SVG icon is linked from +layout.svelte, where Vite fingerprints it. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
